name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cmake_args: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-2022
            cmake_args: -A x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTEPFLUX_BUILD_TESTS=ON -DSTEPFLUX_BUILD=${{ github.run_number }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run tests
        shell: bash
        run: |
          TEST=$(find build -type f \( -name StepFluxTests -o -name StepFluxTests.exe \) | head -n 1)
          "$TEST"

      - name: Validate Audio Unit (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/StepFlux_artefacts/Release/AU/StepFlux.component ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep --sign - ~/Library/Audio/Plug-Ins/Components/StepFlux.component
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i -e loom -e stepflux || true
          auval -v aufx Stfx Loom

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R build/StepFlux_artefacts/Release/VST3/StepFlux.vst3 dist/
          cp -R build/StepFlux_artefacts/Release/AU/StepFlux.component dist/
          codesign --force --deep --sign - dist/StepFlux.vst3
          codesign --force --deep --sign - dist/StepFlux.component
          cp INSTALL.txt dist/
          ROOT=pkgroot/Library/Audio/Plug-Ins
          mkdir -p "$ROOT/VST3" "$ROOT/Components" pkgscripts
          cp -R dist/StepFlux.vst3 "$ROOT/VST3/"
          cp -R dist/StepFlux.component "$ROOT/Components/"
          cat > pkgscripts/postinstall <<'EOS'
          #!/bin/bash
          # remove older per-user copies so Live only sees one StepFlux, clear the download lock, refresh the AU cache
          CONSOLE_USER=$(stat -f%Su /dev/console 2>/dev/null)
          if [ -z "$CONSOLE_USER" ] || [ "$CONSOLE_USER" = "root" ]; then CONSOLE_USER="$USER"; fi
          USER_HOME=$(eval echo "~${CONSOLE_USER}")
          if [ -n "$USER_HOME" ] && [ -d "$USER_HOME/Library/Audio/Plug-Ins" ]; then
            rm -rf "$USER_HOME/Library/Audio/Plug-Ins/VST3/StepFlux.vst3" "$USER_HOME/Library/Audio/Plug-Ins/Components/StepFlux.component"
          fi
          xattr -cr /Library/Audio/Plug-Ins/VST3/StepFlux.vst3 /Library/Audio/Plug-Ins/Components/StepFlux.component || true
          # the plug-in updates itself later, so the user has to own both bundles
          if [ -n "$CONSOLE_USER" ] && [ "$CONSOLE_USER" != "root" ]; then
            chown -R "$CONSOLE_USER" /Library/Audio/Plug-Ins/VST3/StepFlux.vst3 /Library/Audio/Plug-Ins/Components/StepFlux.component || true
          fi
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          EOS
          chmod +x pkgscripts/postinstall
          pkgbuild --analyze --root pkgroot components.plist
          for i in 0 1 2 3; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist 2>/dev/null || true
          done
          cat components.plist
          pkgbuild --root pkgroot --component-plist components.plist --scripts pkgscripts \
            --identifier com.loomn.stepflux.pkg --version "0.1.${{ github.run_number }}" \
            --install-location / StepFlux-macOS.pkg
          pkgutil --payload-files StepFlux-macOS.pkg | head -n 20
          (cd dist && zip -q -r -y ../StepFlux-macOS-update.zip StepFlux.vst3 StepFlux.component)
          unzip -l StepFlux-macOS-update.zip | tail -n 3

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --timeout-ms 120000 --validate dist/StepFlux.vst3

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/StepFlux_artefacts/Release/VST3/StepFlux.vst3 dist/
          Copy-Item INSTALL.txt dist/
          Compress-Archive -Path dist/* -DestinationPath StepFlux-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StepFlux-${{ matrix.name }}
          path: StepFlux-${{ matrix.name }}.${{ runner.os == 'macOS' && 'pkg' || 'zip' }}

      - name: Publish release (macOS)
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" StepFlux-macOS.pkg StepFlux-macOS-update.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "StepFlux build ${{ github.run_number }}" \
            --notes "macOS: VST3 + AU (universal). Run the installer package; it places both plug-ins in /Library/Audio/Plug-Ins."
